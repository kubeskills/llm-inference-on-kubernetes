---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-inference
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - model-cache.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/name: llm-inference
      app.kubernetes.io/part-of: llm-inference-on-kubernetes
    includeSelectors: false
configMapGenerator:
  # Shared runtime settings. Overlays merge their own values on top.
  - name: llm-config
    literals:
      - MODEL_NAME=qwen2.5:0.5b
      - OLLAMA_KEEP_ALIVE=24h
  - name: llm-entrypoint
    files:
      - entrypoint.sh
