---
# Normally generated by scripts/generate-inventory.sh from Pulumi outputs.
all:
  vars:
    ansible_user: root
    # Lab-only known_hosts; quoted because the path may contain spaces.
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=accept-new
      -o 'UserKnownHostsFile "/path/to/repo/.lab/known_hosts"'
  children:
    k3s_server:
      hosts:
        server-0:
          ansible_host: 203.0.113.10
    k3s_agent:
      hosts: {}
    gpu:
      hosts: {}
