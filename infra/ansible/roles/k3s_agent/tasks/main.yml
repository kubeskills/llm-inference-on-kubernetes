---
- name: Create K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

# Read at run time so a GPU-only session run does not depend on earlier plays.
- name: Read the server join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/token
  register: k3s_agent_token_file
  delegate_to: "{{ groups['k3s_server'][0] }}"
  no_log: true

# The install script refuses to install an agent unless K3S_TOKEN or
# K3S_TOKEN_FILE is set, and ignores config.yaml for that check. A root-only
# token file serves both: K3S_TOKEN_FILE for the script, `token-file` in config.
- name: Write the join token file (root-only)
  ansible.builtin.copy:
    content: "{{ k3s_agent_token_file.content | b64decode | trim }}\n"
    dest: /etc/rancher/k3s/agent-token
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart k3s-agent

- name: Write K3s agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  no_log: true
  notify: Restart k3s-agent

- name: Download K3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /usr/local/share/k3s-install.sh
    mode: "0755"

- name: Read installed K3s version
  ansible.builtin.command: k3s --version
  register: k3s_agent_installed
  failed_when: false
  changed_when: false

# K3S_URL makes the install script install the agent service.
- name: Install pinned K3s agent
  ansible.builtin.command: /usr/local/share/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "{{ k3s_server_url }}"
    K3S_TOKEN_FILE: /etc/rancher/k3s/agent-token
  when: k3s_version not in k3s_agent_installed.stdout
  changed_when: true

# K3s docs: confirm the NVIDIA runtime was detected by checking containerd's
# generated config.
- name: Confirm K3s detected the NVIDIA runtime (GPU nodes)
  ansible.builtin.command: >-
    grep nvidia /var/lib/rancher/k3s/agent/etc/containerd/config.toml
  register: k3s_agent_nvidia
  until: k3s_agent_nvidia.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  when: inventory_hostname in groups['gpu']
